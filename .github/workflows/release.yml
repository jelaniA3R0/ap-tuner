# Publishes a release when a version tag is pushed (git tag v0.3.0 && git push origin v0.3.0): builds the Windows
# package with the same toolchain the project is developed and tested with (llvm-mingw, static runtime), runs the
# unit tests, and attaches "AP-Tuner-<version>-windows.zip" to a GitHub release whose notes are that version's
# section of CHANGELOG.md. A version with a "-" (v0.3.0-beta) is marked as a pre-release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      LLVM_MINGW: llvm-mingw-20261006-ucrt-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (llvm-mingw, Ninja)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/$env:LLVM_MINGW.zip" -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\toolchain
          "C:\toolchain\$env:LLVM_MINGW\bin" | Out-File -Append $env:GITHUB_PATH
          pip install ninja
      - name: Build
        shell: pwsh
        run: |
          cmake -G Ninja -S cpp -B cpp/build/release -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DAPTUNER_WARNINGS_AS_ERRORS=ON
          cmake --build cpp/build/release
      - name: Test
        run: ctest --test-dir cpp/build/release -R "unit|version|usage|refuses" --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/make-release.ps1 -SkipBuild
          $zip = Join-Path (Split-Path -Parent $PWD) 'AP Tuner C++.zip'
          if (-not (Test-Path $zip)) { throw 'the package was not made' }
          $name = "AP-Tuner-$($env:GITHUB_REF_NAME)-windows.zip"
          Move-Item $zip $name
          "ZIP=$name" | Out-File -Append $env:GITHUB_ENV
          # the notes: this version's section of CHANGELOG.md
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($v))[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value } else { 'See CHANGELOG.md' }
          $notes + "`n**Install:** download the zip below, unzip it, double-click ``Install AP Tuner.cmd``. Windows may warn that the app is not recognised (it is not code-signed): More info, Run anyway." | Out-File -Encoding utf8 notes.md
          exit 0
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
